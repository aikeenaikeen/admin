server {
    listen 8080;
    server_name localhost;
    client_max_body_size 250m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend
    # ^~ = priority prefix (stops regex matching)
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploads (employee photos, etc.) to backend
    # ^~ = priority prefix (stops regex matching)
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Видеопотоки открываются только по подписанной ссылке от backend
    # (GET /api/cameras/:id/stream-url: exp + sig на одну камеру).
    # <img> не шлёт Authorization, поэтому перед проксированием nginx
    # спрашивает backend, подходит ли подпись к запрошенному адресу:
    # 204 — пускаем, 401 — отдаём 401 браузеру.
    location = /_stream_auth {
        internal;
        proxy_pass http://backend:3000/api/stream-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # $request_uri — исходный адрес браузера без нормализации; backend
        # принимает только строгие пути, так что проверенный путь совпадает
        # с проксируемым.
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Поток режима распознавания (recognition-service). Наружу уходит только
    # cameraId: exp/sig и прочие параметры браузера дальше nginx не идут.
    location = /video_feed {
        auth_request /_stream_auth;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $recognition_upstream recognition-service:5001;
        proxy_pass http://$recognition_upstream/video_feed?cameraId=$arg_cameraId;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Уменьшенный поток камеры из camera-gateway. Общий токен шлюза браузер
    # не видит: nginx подставляет его сам (envsubst из CAMERA_GATEWAY_ACCESS_TOKEN
    # при старте контейнера), а от параметров браузера оставляет только preview=1.
    location ^~ /streams/ {
        auth_request /_stream_auth;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $camera_gateway_upstream camera-gateway:4000;
        proxy_pass http://$camera_gateway_upstream$uri?preview=1;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Gateway-Token "${CAMERA_GATEWAY_ACCESS_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
